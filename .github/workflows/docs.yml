name: docs
on:
  workflow_dispatch:
# gate P2-5(五视角自审): GitHub Pages 未启用致 deploy 永久红——push 触发改为仅手动,
# 消除每次 push 的红噪音; Pages 启用后可恢复 push 触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Regenerate command list (metadata 单一源)
        run: |
          pip install -q .
          python3 scripts/gen_metadata.py --render
          # 同步 docs/commands.md(mkdocs 页面)——防 metadata 更新后快照漂移
          python3 scripts/sync_docs_commands.py
      - name: Build docs
        run: |
          pip install -q mkdocs mkdocs-material
          cp README.md docs/readme-src.md 2>/dev/null || true
          mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
