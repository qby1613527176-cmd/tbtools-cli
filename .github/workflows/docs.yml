name: docs
on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'tbtools_cli/command_metadata.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Regenerate command list (metadata 单一源)
        run: |
          pip install -q .
          python3 scripts/gen_metadata.py --render
      - name: Build docs
        run: |
          pip install -q mkdocs mkdocs-material
          cp README.md docs/readme-src.md 2>/dev/null || true
          mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
