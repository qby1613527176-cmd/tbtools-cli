name: tbtools-cli CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: pip install click pytest ruff pyyaml
      - name: Lint (ruff 硬失败)
        run: ruff check .
      - name: Windows 无 jar CLI 冒烟(跨平台验证)
        shell: bash
        run: |
          python -m tbtools_cli.cli version | grep -q "tbtools-cli" && echo "✅ version"
          python -m tbtools_cli.cli list plots | grep -cE '^    ' | awk '$1>100 {print "✅ list plots:", $1}'
          python -m tbtools_cli.cli sets ven 2>&1 | grep -q "venn" && echo "✅ 拼写纠错"
          python -m tbtools_cli.cli --help | grep -q "TBtools-II" && echo "✅ help"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb shellcheck
          pip install click pytest ruff pyyaml

      # ── L1: 框架/静态/lint（无 TBtools jar 依赖）────────────────────────
      - name: Lint with ruff (硬失败)
        run: |
          ruff check .
          echo "✅ ruff 0 errors"

      - name: Shellcheck (硬失败)
        run: |
          shellcheck -S warning bin/tbplot.sh bin/tbtools_rpc.sh bin/tbengine.sh bin/tbtools \
            install.sh examples/scripts/run_examples.sh config/config.sh scripts/*.sh
          echo "✅ shellcheck 0 warnings"

      - name: Bash syntax
        run: |
          set -e
          for f in bin/tbplot.sh bin/tbtools bin/tbengine.sh bin/tbtools_rpc.sh \
                   install.sh run_examples.sh examples/scripts/run_examples.sh config/config.sh; do
            bash -n "$f" && echo "✅ $f syntax OK"
          done

      - name: Type check with mypy (严格模式,含未注解函数)
        run: |
          pip install mypy
          python3 -m mypy tbtools_cli/

      - name: Coverage report (visible, non-blocking)
        run: |
          pip install -q pytest-cov
          python3 -m pytest --cov=tbtools_cli --cov-report=term-missing tests/ -q 2>&1 | tail -6

      - name: Run full pytest suite
        run: |
          set -o pipefail
          python3 -m pytest tests/ -q --tb=short

      # ── L1.5: 无 jar 的 CLI 冒烟（真实命令,非 import）──────────────────
      - name: CLI smoke without jar (version/list/help/纠错/new/check)
        run: |
          set -e
          python3 -m tbtools_cli.cli version | grep -q "tbtools-cli" && echo "✅ version"
          python3 -m tbtools_cli.cli list plots | grep -cE '^    ' | awk '$1>100 {print "✅ list plots:", $1}'
          python3 -m tbtools_cli.cli list tools | grep -q "命令行工具" && echo "✅ list tools"
          python3 -m tbtools_cli.cli sets ven 2>&1 | grep -q "venn" && echo "✅ 拼写纠错"
          python3 -m tbtools_cli.cli new --list | grep -q "场景" && echo "✅ new 向导"
          python3 -m tbtools_cli.cli check /no/such/file 2>/dev/null; [ $? -ne 0 ] && echo "✅ check 失败退出码"
          python3 -m tbtools_cli.cli --help | grep -q "TBtools-II" && echo "✅ help"

      - name: Verify metadata (唯一数据源一致性)
        run: |
          python3 scripts/gen_metadata.py --check
          python3 -c "
          import json
          m = json.load(open('tbtools_cli/command_metadata.json'))
          assert len(m) >= 200, f'Expected >=200 commands, got {len(m)}'
          print(f'Commands: {len(m)}')
          "
