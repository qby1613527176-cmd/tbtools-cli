name: nightly-e2e

# 真实引擎 nightly 回归(GPT 评审 #5): 5+ 代表命令 × 真实 JAR × 真实 examples 数据
# 每日 01:00 UTC 自动跑; fetch-jar 静默下载真实 JAR → 每个命令断言出图/产物非空

permissions:
  contents: write      # Report writeback PR: 建分支
  pull-requests: write # Report writeback PR: 建 PR(peter-evans/create-pull-request@v6 双权限,
                       # 缺 pull-requests: write → "Resource not accessible by integration" 403)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 每日 01:00 UTC

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install xvfb + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          pip install -r requirements-ci.txt  # gate P2-3: 依赖 pin 纪律统一
          python3 -m pip show click >/dev/null 2>&1 || pip install click

      - name: Fetch real JAR (silent)
        run: |
          python3 -m tbtools_cli.cli fetch-jar --yes 2>&1 | tail -3
          python3 -m tbtools_cli.cli doctor 2>&1 | grep -E "✅ JAR|sha256" | head -2

      - name: Nightly E2E (real engine plots)
        run: |
          xvfb-run -a bash scripts/e2e_nightly.sh

      - name: Gate — pytest (wrapper layer)
        run: |
          pip install -r requirements-ci.txt  # 自审 gate P1-2: 锁定与本地对齐
          python3 -m pytest tests/ -q 2>&1 | tail -1
          ruff check . 2>&1 | tail -1

      # ── 自审 gate P1-5: 真实引擎执行验证回写(证据保鲜)────────────
      # nightly 有真实 JAR——跑 conformance 执行验证全量, TBTOOLS_WRITE_REPORT=1
      # 回写 verification_report.json(verified_at/env_fp 刷新) → 提交 PR 让主分支
      # 的 EXECUTION_VERIFIED 证据持续保鲜(不再依赖"有人记得本机跑")。
      - name: Execution verification refresh (real JAR → report writeback)
        run: |
          pip install -r requirements-ci.txt  # gate P2-3: 统一 pin
          export TBTOOLS_WRITE_REPORT=1
          python3 -m pytest tests/test_conformance_verified.py -q --tb=short 2>&1 | tail -12

      # 自审 gate P1-5: TTL 严格检查——身份/报告保鲜确认(>90 天未刷新 → 红)
      - name: Verification TTL gate (strict)
        run: |
          export TBTOOLS_TTL_STRICT=1
          python3 scripts/gen_metadata.py --check 2>&1 | tail -6

      - name: Report writeback PR (evidence freshness)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: verification_report 夜间保鲜(真实引擎执行)"
          title: "[nightly] verification report refresh (real engine)"
          branch: nightly/verification-refresh
          delete-branch: true
          labels: automation
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            tests/verification_report.json