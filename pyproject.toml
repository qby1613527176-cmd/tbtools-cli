[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbtools-cli"
version = "1.0.0"
description = "TBtools-II command-line wrapper: 218 engines, 188 RPC methods, journal presets, pitfall hints"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "tbtools-cli contributors" }
]
keywords = ["bioinformatics", "tbtools", "cli", "plotting", "genomics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Java",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/qby1613527176-cmd/tbtools-cli"  # 本仓库
upstream = "https://github.com/CJ-Chen/TBtools"  # TBtools-II 上游
Documentation = "docs/COMMAND_REFERENCE.md"

[project.scripts]
tbtools = "tbtools_cli.cli:cli"

[tool.setuptools]
packages = ["tbtools_cli"]

[tool.setuptools.package-data]
tbtools_cli = ["command_metadata.json", "config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# core 正确性规则 + py310 目标（target-version 须在顶层；lint 段不支持）
target-version = "py310"
# 转换生成的回归脚本(scripts/rpc_regression_linux.sh 产物)非手写代码,不 lint
exclude = ["tests/rpc_regression_linux"]

[tool.ruff.lint]
# 核心正确性规则（F=pyflakes），忽略低危风格类（捕获性 except 是 CLI 容错设计）
select = ["F", "E4", "E7", "E9"]
# E702/E704 分号等忽略; E701/E702 单行多语句为历史 CLI 风格(批次 B 拆 cli.py 重构时自然消除)
ignore = ["E501", "E722", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# auto_commands 生成代码风格容忍
"tbtools_cli/auto_commands.py" = ["E4", "E7"]
# bin/tbcli.py: 旧入口兼容层(已由 cli_tools_registry 替代,不重构)
"bin/tbcli.py" = ["E401", "E402", "E741", "F541"]
# tests/rpc_regression_linux/: 转换生成的回归脚本(Windows 路径参数化产物,非手写)
"tests/rpc_regression_linux/*.py" = ["E401", "E402", "E741", "F401", "F541", "E743"]
