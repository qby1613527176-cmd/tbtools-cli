[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbtools-cli"
version = "1.4.92"
description = "TBtools-II command-line wrapper: 200+ engines, 188+ RPC methods, journal presets, pitfall hints (exact counts via `tbtools version`)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "tbtools-cli contributors" }
]
keywords = ["bioinformatics", "tbtools", "cli", "plotting", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",  # 88 测试多为框架/防漂移;Java 出图依赖本机 jar
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Java",
]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",  # command_spec _apply_contract_overlay YAML 快照校验(干净 venv 实测缺它 CLI 崩)
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
mcp = ["mcp"]  # tbtools mcp 子命令(MCP server, 延迟 import, 非核心)

[project.urls]
Homepage = "https://github.com/qby1613527176-cmd/tbtools-cli"  # 本仓库
upstream = "https://github.com/CJ-Chen/TBtools"  # TBtools-II 上游
Documentation = "https://github.com/qby1613527176-cmd/tbtools-cli/blob/main/docs/COMMAND_REFERENCE.md"
Source = "https://github.com/qby1613527176-cmd/tbtools-cli"
Issues = "https://github.com/qby1613527176-cmd/tbtools-cli/issues"

[project.scripts]
tbtools = "tbtools_cli.cli:cli"

[tool.setuptools.packages.find]
# P06-A(WOX 实跑): 显式 ["tbtools_cli"] 只打顶层包——runtime/ 子包不进 wheel
# (pip install 后 ModuleNotFoundError: No module named 'tbtools_cli.runtime');
# find 自动发现所有子包(含 runtime/)
include = ["tbtools_cli*"]

[tool.setuptools.data-files]
# pip 安装后桥源码必须存在于包内(ensure_bridge 运行时编译;118 桥)
# 2026-09-23 评估: setuptools 计划弃用 data-files 但未移除——保留(现状 wheel 验证 OK,
# 迁移需包内双份维护 bridges, 风险>收益; 弃用真正生效时再迁 wheel 打包方式)
"tbtools_cli/bridges" = ["bridges/*.java"]

[tool.setuptools.package-data]
tbtools_cli = ["command_metadata.json", "command_metadata.fingerprint.json", "verification_report.json", "config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real TBtools JAR (run in nightly-e2e / with TBTOOLS_JAR set)",
]

[tool.ruff]
# core 正确性规则 + py310 目标（target-version 须在顶层；lint 段不支持）
target-version = "py310"
# 转换生成的回归脚本(scripts/rpc_regression_linux.sh 产物)非手写代码,不 lint
exclude = ["tests/rpc_regression_linux", "docs/_generated"]  # _generated: ast_minfy/gen_metadata 自动产物

[tool.ruff.lint]
# 核心正确性规则（F=pyflakes），忽略低危风格类（捕获性 except 是 CLI 容错设计）
select = ["F", "E4", "E7", "E9"]
# E702/E704 分号等忽略; E701/E702 单行多语句为历史 CLI 风格(批次 B 拆 cli.py 重构时自然消除)
ignore = ["E501", "E722", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# auto_commands 生成代码风格容忍
"tbtools_cli/auto_commands.py" = ["E4", "E7"]
# core.py 末尾重导出(拆分兼容): F401 有意保留
"tbtools_cli/core.py" = ["F401"]
# bin/tbcli.py: 旧入口兼容层(已由 cli_tools_registry 替代,不重构)
"bin/tbcli.py" = ["E401", "E402", "E741", "F541"]
# tests/rpc_regression_linux/: 转换生成的回归脚本(Windows 路径参数化产物,非手写)
"tests/rpc_regression_linux/*.py" = ["E401", "E402", "E741", "F401", "F541", "E743"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true  # 与 CI 一致(第七轮评审: 配置分裂)
disallow_any_generics = false
no_implicit_optional = false
# 评审 #115 预审 P2-7(E3): import-untyped 豁免从全局收窄到 tbtools_cli.* per-module——
# 全局禁用放水半径随时间扩大(未来新增无 stub 依赖的模块 import 错被静默);
# 现仅 tbtools_cli 包内 yaml import(command_spec/workflow) 豁免, 新模块不受牵制。

[[tool.mypy.overrides]]
module = "tbtools_cli.*"
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = ["tbtools_cli"]
# omit 说明(自审 gate P1-1 响应): cli_load.py 承载 CATEGORY_MAP/gen_metadata 分组推断
# 依赖的元数据加载逻辑(测试面少但被间接覆盖); runtime/__init__.py 纯 re-export 门面。
omit = ["tbtools_cli/cli_load.py", "tbtools_cli/runtime/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# 自审 gate P1-1: coverage 从"纯展示"升级为门禁成员——fail_under 基线 35%
# (2026-10-06 实测 37%, 留 2pt 缓冲防 flaky; 覆盖率随测试膨胀不得无信号下降)
fail_under = 35
