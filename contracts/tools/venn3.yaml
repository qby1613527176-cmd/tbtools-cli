  related_to:
  - venn2
  - venn3
  - upset
inputs:
- name: list1
  role: file
  format: txt
  required: true
  note: ''
- name: list2
  role: file
  format: txt
  required: true
  note: ''
- name: list3
  role: file
  format: txt
  required: true
  note: ''
outputs:
- svg
