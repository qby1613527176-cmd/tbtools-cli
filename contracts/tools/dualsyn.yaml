name: dualsyn
kind: bridge
mode: bridge
class: DualSynCli
xmx: 3g
runner: plot
group: syn
help: 'dualsyn: dualsyn <simplifiedGff> <collinearity> <out> [--chr1 "1,2"] '
capabilities:
- synteny
- visualization
capabilities_ontology:
- genomics
- genomics.synteny
- synteny
- visualization
relations:
  accepts:
  - SIMPLIFIED_GFF
  - COLLINEARITY
  produces:
  - SYNTENY_PLOT
parameters:
- name: chr1
  type: string
  default: null
  required: false
  note: 逗号分隔染色体
- name: chr2
  type: string
  default: null
  required: false
  note: ''
inputs:
- name: gff
  role: file
  format: tsv
  required: true
  note: 简化 GFF
- name: pairs
  role: file
  format: tsv
  required: true
  note: ''
outputs:
- svg
