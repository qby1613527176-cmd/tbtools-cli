name: iqtree
kind: bridge
mode: bridge
class: QuickRunIQtreeCli
xmx: 2g
runner: java
group: tree
help: 'iqtree <aln.fa> <outPrefix> [--model MFP] [--ufboot 1000] [--boot N] [--freerate]
  [--asc] [--threads N] [--redo]   # IQ-TREE ML 建树（GUI 逆向 #28 QuickRunIQtree；⚠️ UFBoot
  须 ≥1000 否则引擎静默失败；产物 outPrefix.treefile；依赖系统 iqtree）'
semantic_fingerprint: 6d8ecd58b43587b39820ea59e6ff47c6394c2917a9c7de52b13e0641c3e24a6c
semantic_fingerprint_short: 6d8ecd58b43587b3
capabilities:
- phylogeny
capabilities_ontology:
- phylogeny
dependencies:
- iqtree2
dependency_manifest:
- name: iqtree2
  type: binary
  required: true
  platforms:
  - linux
  - macos
  executable: iqtree2
  version_args:
  - --version
relations:
  accepts:
  - ALIGNMENT
  produces:
  - PHYLOGENY_NWK
  next_step:
  - tree
parameters:
- name: bb
  type: int
  default: 1000
  required: false
  note: UFBoot ≥1000
- name: t
  type: int
  default: 4
  required: false
  note: ''
inputs:
- name: aln
  role: file
  format: fasta
  required: true
  note: ''
  content_type: alignment
outputs:
- nwk
output_slots:
- name: tree
  format: nwk
  content_type: tree
