name: genestructure
kind: manual
mode: manual
class: ''
xmx: 2g
runner: plot
group: seq
help: (alias of structure) 基因结构图（外显子/UTR 从 GFF）
alias_of: structure
capabilities:
- gene_structure
- annotation
- visualization
capabilities_ontology:
- annotation
- gene_structure
- genomics
- genomics.annotation
- visualization
relations:
  accepts:
  - GFF3
  - GENE_ID_LIST
  produces:
  - GENE_STRUCTURE_PLOT
parameters:
- name: w
  type: int
  default: 1000
  required: false
  note: ''
- name: h
  type: int
  default: 800
  required: false
  note: ''
- name: genome
  type: string
  default: null
  required: false
  note: 可选基因组 FASTA
inputs:
- name: gff
  role: file
  format: gff3
  required: true
  note: ''
- name: ids
  role: file
  format: txt
  required: true
  note: ''
outputs:
- svg
