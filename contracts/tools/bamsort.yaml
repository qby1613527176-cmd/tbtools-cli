name: bamsort
kind: bridge
mode: bridge
class: BamSortCli
xmx: 3g
runner: plot
group: asm
help: 'bamsort: bamsort <in.bam> <out.bam> [sortOrder] [tmpDir]'
capabilities:
- assembly
capabilities_ontology:
- assembly
- genomics
- genomics.assembly
relations:
  accepts:
  - GENOME
  - GFF
  produces:
  - ASSEMBLY_OUT
