name: taxparse
kind: bridge
mode: bridge
class: TaxonomyBatchCli
xmx: 2g
runner: java
group: table
help: 'taxparse <idList.txt> <out.xls>   # 物种名批量分类解析（GUI 逆向 #38 TaxonomyParserGUIPanel→NCBITaxonomy；⚠️
  联网 NCBI eutils；输出 9 级分类+透传列；单次版=tbtools tool NCBITaxonomy）'
capabilities:
- table_operations
capabilities_ontology:
- table
- table_operations
dependencies:
- internet
dependency_manifest:
- name: internet
  type: capability
  required: true
  platforms:
  - linux
  - macos
  - windows
relations:
  accepts:
  - TABLE
  produces:
  - TABLE_OUT
