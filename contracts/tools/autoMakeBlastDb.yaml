name: autoMakeBlastDb
kind: tool
mode: tool
class: biocjava.bioDoer.BLAST.makeblastdb
xmx: 3g
runner: java
group: tool
help: ''
inputs:
- name: fasta
  role: file
  format: fasta
  required: true
  note: ''
  content_type: protein
outputs:
- db
named_flags:
  inputs:
    fasta: --inFasta
  output: --outBase
