name: recipBlast
kind: direct
mode: direct
class: biocjava.bioDoer.BLAST.ReciprocalBlast.ReciprocalBlast
xmx: 3g
runner: plot
group: blast
help: 'recipBlast: recipBlast --querySeqFile q.fa --subjectSeqFile s.fa --outDirAndPrefix
  outPrefix [--queryIdListFile ids.txt] [--evalue 1e-5] [--NumOfthreads 4]   # RBH
  双向最优比对（ArgsParser 风格：参数必须 --key value 形态；依赖系统 blastp/makeblastdb）'
semantic_fingerprint: 1fb57ab5bcf2b5616b85b2ffc1ff99b4724fe5987682ac2305881cd265fd31d3
semantic_fingerprint_short: 1fb57ab5bcf2b561
capabilities:
- homology
- reciprocal_best_hit
- blast
capabilities_ontology:
- blast
- homology
- reciprocal_best_hit
- sequence
- sequence.homology
- sequence.homology.reciprocal_best_hit
relations:
  accepts:
  - FASTA
  produces:
  - BLAST_HITS
  - RBH_TABLE
  next_step:
  - filterCScore
  related_to:
  - twoSeqBlast
inputs:
- name: query
  role: file
  format: fasta
  required: true
  note: ''
  content_type: protein
- name: subject
  role: file
  format: fasta
  required: true
  note: ''
  content_type: protein
outputs:
- tsv
output_slots:
- name: result
  format: tsv
  content_type: table
named_flags:
  inputs:
    query: --querySeqFile
    subject: --subjectSeqFile
  output: --outDirAndPrefix
