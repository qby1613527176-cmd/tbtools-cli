name: recipBlast
kind: direct
mode: direct
class: biocjava.bioDoer.BLAST.ReciprocalBlast.ReciprocalBlast
xmx: 3g
runner: plot
group: blast
help: 'recipBlast: recipBlast <query.fa> <subject.fa> <outPrefix> [--queryIds i'
capabilities:
- homology
- reciprocal_best_hit
capabilities_ontology:
- homology
- reciprocal_best_hit
- sequence
- sequence.homology
- sequence.homology.reciprocal_best_hit
relations:
  accepts:
  - FASTA
  produces:
  - BLAST_HITS
  next_step:
  - filterCScore
inputs:
- name: db
  role: file
  format: fasta
  required: true
  note: ''
- name: query
  role: file
  format: fasta
  required: true
  note: ''
outputs:
- tsv
