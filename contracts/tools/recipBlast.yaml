name: recipBlast
kind: direct
mode: direct
class: biocjava.bioDoer.BLAST.ReciprocalBlast.ReciprocalBlast
xmx: 3g
runner: plot
group: blast
help: 'recipBlast: recipBlast --querySeqFile q.fa --subjectSeqFile s.fa --outDirAndPrefix
  outPrefix [--queryIdListFile ids.txt] [--evalue 1e-5] [--NumOfthreads 4]   # RBH
  双向最优比对（⚠️ ArgsParser 风格：位置参数会被引擎忽略并静默退出——Bug3 实跑修复；依赖系统 blastp/makeblastdb）'
capabilities:
- homology
- reciprocal_best_hit
capabilities_ontology:
- homology
- reciprocal_best_hit
- sequence
- sequence.homology
- sequence.homology.reciprocal_best_hit
relations:
  accepts:
  - FASTA
  produces:
  - BLAST_HITS
  next_step:
  - filterCScore
inputs:
- name: db
  role: file
  format: fasta
  required: true
  note: ''
- name: query
  role: file
  format: fasta
  required: true
  note: ''
outputs:
- tsv
