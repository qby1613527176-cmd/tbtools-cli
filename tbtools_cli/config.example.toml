# tbtools-cli 配置文件
# 位置: ~/.config/tbtools-cli/config.toml
# 首次运行 install.sh 自动生成（可手改）

# TBtools JAR 路径（优先级: 环境变量 > 配置文件 > 自动探测）
jar = "/mnt/d/shengwu/TBtools/TBtools_JRE1.6.jar"

# 默认参数（可被命令行 --option 覆盖）
[defaults]
threads = 4
format = "svg"
# preset = "nature"           # 取消注释启用默认预设
# verbose = false
# quiet = false

# 自定义画布尺寸（0=自动）
[canvas]
width = 0
height = 0
